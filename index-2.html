<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wedding Gallery Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f4f5;--sf:#fff;--ink:#1e1a1c;--mu:#6d6568;--ln:#e6e2e4;--rd:#9b0014;--rdl:#f9e8ea;--ok:#17724a;--okl:#e3f4ec;--wn:#a35a00;--wnl:#fdf0dc;--er:#b3141f;--erl:#fde7e8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root:not([data-theme="light"]){color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#151213;--sf:#201b1d;--ink:#f1ecee;--mu:#a49a9e;--ln:#352e31;--rd:#e0485c;--rdl:#3a1a20;--ok:#58c797;--okl:#173226;--wn:#e8a64d;--wnl:#3a2a10;--er:#ff7b85;--erl:#3d1a1d}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#151213;--sf:#201b1d;--ink:#f1ecee;--mu:#a49a9e;--ln:#352e31;--rd:#e0485c;--rdl:#3a1a20;--ok:#58c797;--okl:#173226;--wn:#e8a64d;--wnl:#3a2a10;--er:#ff7b85;--erl:#3d1a1d}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Figtree,system-ui,sans-serif}
h1,h2,h3{font-family:'Cormorant Garamond',Georgia,serif;margin:0;font-weight:700}h1{font-size:30px}h2{font-size:22px}h3{font-size:18px}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
nav{background:var(--sf);border-right:1px solid var(--ln);padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:2px}
nav img{width:150px;margin:0 auto 14px;display:block}
nav a{display:block;padding:10px 14px;border-radius:8px;color:var(--ink);text-decoration:none;font-weight:500}
nav a:hover{background:var(--bg)}nav a.on{background:var(--rd);color:#fff}
.samp{margin-top:auto;font-size:12px;color:var(--wn);background:var(--wnl);padding:8px 10px;border-radius:8px}
main{padding:26px;max-width:1200px;width:100%;min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:16px;min-width:0}
.grid{display:grid;gap:14px}.k4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}.k2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.kpi small{color:var(--mu);display:block}.kpi b{font-size:24px;font-family:'Cormorant Garamond',serif}
.pos{color:var(--ok)}.neg{color:var(--er)}
button,input,select,textarea{font:inherit;color:var(--ink)}
.btn{background:var(--sf);border:1px solid var(--ln);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:500}
.btn.p{background:var(--rd);border-color:var(--rd);color:#fff}.btn.d{color:var(--er)}.btn.s{padding:4px 10px;font-size:13px}
input,select,textarea{background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:8px 10px;width:100%}
.bar input,.bar select{width:auto}
:focus-visible{outline:2px solid var(--rd);outline-offset:2px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:560px}
th,td{text-align:left;padding:10px;border-bottom:1px solid var(--ln);vertical-align:top}th{font-size:13px;color:var(--mu);font-weight:600}
td.n,th.n{text-align:right;white-space:nowrap}tr.c{cursor:pointer}tr.c:hover{background:var(--bg)}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600}
.paid{background:var(--okl);color:var(--ok)}.unpaid,.partial{background:var(--wnl);color:var(--wn)}.overdue{background:var(--erl);color:var(--er)}
.dd b{display:block;font-weight:600}.dd small{color:var(--mu)}
.empty{text-align:center;color:var(--mu);padding:30px}
.mo{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-start;justify-content:center;padding:20px;overflow:auto;z-index:20}
.md{background:var(--sf);border-radius:14px;padding:20px;width:100%;max-width:640px;margin:auto}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 3px}.er{color:var(--er);font-size:12px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cal .h{text-align:center;font-size:12px;color:var(--mu);padding:4px}
.day{min-height:84px;border:1px solid var(--ln);border-radius:8px;padding:5px;cursor:pointer;background:var(--sf);min-width:0;overflow:hidden}
.day b{font-size:20px;font-family:'Cormorant Garamond',serif}.day small{color:var(--mu);float:right;font-size:11px}
.day.t{border-color:var(--rd);box-shadow:inset 0 0 0 1px var(--rd)}.day.x{opacity:.35;cursor:default}
.ev{display:block;font-size:11px;background:var(--rdl);color:var(--rd);border-radius:4px;padding:1px 4px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--ln)}.row:last-child{border:0}
.menu{display:none}
@media(max-width:820px){.app{grid-template-columns:1fr}nav{position:fixed;inset:0 auto 0 0;width:240px;transform:translateX(-100%);transition:transform .2s;z-index:15}nav.open{transform:none}.menu{display:inline-block}main{padding:16px}.day{min-height:62px}.ev{display:none}.day small{float:none;display:block}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>

const ne=n=>String(n).replace(/\d/g,c=>'०१२३४५६७८९'[c]);
const toBs=iso=>{let n=Math.round((Date.parse(iso+'T00:00:00Z')-BS0)/D);if(!(n>=0&&n<365))return null;let m=0;while(n>=BSM[m]){n-=BSM[m];m++}return{m,d:n+1}};
const toAd=(m,d)=>{let n=d-1;for(let i=0;i<m;i++)n+=BSM[i];return new Date(BS0+n*D).toISOString().slice(0,10)};
const adF=iso=>new Date(iso+'T00:00:00Z').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric',timeZone:'UTC'});
const dual=iso=>{if(!iso)return'—';const b=toBs(iso);return`<span class="dd"><b>${b?`${ne(b.d)} ${MN[b.m]} ${ne(BSY)}`:'BS data not loaded'}</b><small>${adF(iso)}</small></span>`};
const TODAY=new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const ETYPES=['Wedding','Engagement','Pre-wedding shoot','Mehendi','Haldi','Reception','Bratabandha','Other'],IC=['Event payment','Album / prints','Other income'],EC=['Equipment','Travel','Food','Software','Rent','Marketing','Other expense'];

const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}if(dbr&&cloudReady&&!remoteApplying){clearTimeout(tmr);tmr=setTimeout(async()=>{sync('Syncing…');const {error}=await dbr.from('wg_admin_state').upsert({id:1,json:S,updated_at:new Date().toISOString()},{onConflict:'id'});sync(error?'Cloud save failed: '+error.message:'All devices synced');},450)}};

/* calculations */
const evPaid=e=>sum(S.txns.filter(t=>t.type=='income'&&t.status=='paid'&&t.eventId==e.id)),evBal=e=>Math.max(0,e.price-evPaid(e));
const evSt=e=>{const b=evBal(e);return b<=0?'paid':e.date<TODAY?'overdue':evPaid(e)>0?'partial':'unpaid'};
const txSt=t=>t.status=='paid'?'paid':t.due&&t.due<TODAY?'overdue':'unpaid';

const totals=r=>{const f=(ty,s)=>sum(r.filter(x=>x.type==ty&&(s=='all'||txSt(x)==s)));return{inc:f('income','paid'),exp:f('expense','paid'),recv:f('income','unpaid')+f('income','overdue'),over:f('income','overdue'),pay:f('expense','unpaid')+f('expense','overdue')}};
const empStat=id=>{const a=S.asg.filter(x=>x.empId==id),e=sum(a),p=sum(S.pays.filter(x=>x.empId==id));return{earned:e,paid:p,out:e-p}};

<div class="grid k2" style="margin-top:14px"><div class="card"><h3>Event types</h3><div class="bar" style="margin:10px 0">${ET().map(t=>`<span class="tag" style="background:var(--rdl);color:var(--rd)">${esc(t)} <a href="#settings" style="color:inherit;text-decoration:none" aria-label="Remove ${esc(t)}" onclick="delType(${esc(JSON.stringify(t))});return false">×</a></span>`).join('')}</div><div class="bar"><input id="nt" placeholder="New type, e.g. Anniversary"><button class="btn p" onclick="addType()">Add type</button></div></div><div class="card"><h3>Shared cloud account</h3><p>Signed in as <b>${esc(curU||'')}</b>. Use this same email and password on your other computers and phones. All devices share the same client, event, finance, employee and salary records.</p><p><small>To change the password, use Supabase Dashboard → Authentication → Users. Do not share your password with employees unless you want them to have full admin access.</small></p><button class="btn" onclick="signOut()">Sign out</button></div></div>
<div class="card" style="margin-top:14px"><h3>BS date table to verify (${BSY} BS)</h3><p><small>Conversion is exact day-counting from Baisakh 1, 2083 = 14 Apr 2026. Month lengths were taken from published 2083 BS calendars (vedicmarga.com, merokalam.com); compare them to your printed patro. Years outside 2083 are not guessed, they show "BS data not loaded". To extend, add the verified month lengths and start date at the top of the script.</small></p>${tbl(['Month','Days','Starts (AD)','Ends (AD)'],BSM.map((d,i)=>`<tr><td>${MN[i]} · ${ME[i]}</td><td>${d}</td><td>${adF(toAd(i,1))}</td><td>${adF(toAd(i,d))}</td></tr>`),'')}<p>Total ${BSM.reduce((a,b)=>a+b)} days. <label for="ck">Check any date</label><input id="ck" type="date" onchange="$('#cko').innerHTML=dual(this.value)"> <span id="cko"></span></p></div>`)};
window.setTheme=v=>{v?document.documentElement.dataset.theme=v:delete document.documentElement.dataset.theme;try{localStorage.setItem('wg_theme',v)}catch(e){}};
try{const t=localStorage.getItem('wg_theme');if(t)setTheme(t)}catch(e){}
const ET=()=>S.etypes||ETYPES;
const info=(t,m)=>modal(`<h3>${t}</h3><p>${m}</p><button class="btn" onclick="closeM()">OK</button>`);
window.signOut=async()=>{if(supa)await supa.auth.signOut();curU=null;cloudReady=false;dbWait=false;render()};
window.addType=()=>{const v=$('#nt').value.trim();if(!v)return;if(ET().some(t=>t.toLowerCase()==v.toLowerCase()))return info('Already exists','That event type is already in the list.');S.etypes=[...ET(),v];save();render()};
window.delType=t=>S.events.some(e=>e.type==t)?info('Can\'t remove','Some events use this type. Change those events first.'):confirmD('Remove this event type?',()=>S.etypes=ET().filter(x=>x!=t));
function gate(){const g=$('#gate'),ap=document.querySelector('.app');if(cloudReady&&curU&&!dbWait){g.innerHTML='';g.dataset.m='';ap.style.display='';return false}
 ap.style.display='none';
 if(!supa){g.innerHTML=`<div class="md" style="margin:7vh auto;max-width:650px"><h2>Connect your shared cloud database</h2><p>This upgraded version uses Supabase so the same login works on every device and changes sync automatically.</p><ol><li>Create a free project at <a href="https://supabase.com" target="_blank" rel="noopener">supabase.com</a>.</li><li>In Supabase → SQL Editor, run the SQL shown in the HTML file comment named <b>SUPABASE SQL SETUP</b>.</li><li>In Supabase → Project Settings → API, copy the Project URL and anon/public key.</li><li>Open this HTML file in a text editor and replace <code>SUPABASE_URL</code> and <code>SUPABASE_ANON_KEY</code> near the top of the script.</li><li>In Authentication → Users, create your admin email and password. Use those same credentials on every device.</li><li>Upload the updated file to GitHub as <code>index.html</code>.</li></ol><p><b>Important:</b> Never paste a service-role key into this file. Only use the anon/public key.</p><p>After configuration, reload this page to sign in.</p></div>`;return true}
 if(dbWait){g.innerHTML='<div class="md" style="margin:12vh auto;max-width:380px;text-align:center">Connecting to shared database…</div>';return true}
 g.innerHTML=`<div class="md" style="margin:8vh auto;max-width:390px"><img src="${document.querySelector('nav img').src}" alt="Wedding Gallery" style="width:170px;display:block;margin:0 auto 12px"><h2>Wedding Gallery Admin</h2><p>Sign in with your shared admin account.</p><form id="lf" novalidate><label for="lu">Email</label><input id="lu" type="email" autocomplete="username" required><label for="lp">Password</label><input id="lp" type="password" autocomplete="current-password" required><div class="er" id="le"></div><button class="btn p" style="margin-top:14px;width:100%">Sign in</button></form></div>`;
 $('#lf').onsubmit=async e=>{e.preventDefault();const email=$('#lu').value.trim(),password=$('#lp').value,er=$('#le');er.textContent='Signing in…';const {error}=await supa.auth.signInWithPassword({email,password});if(error)er.textContent=error.message;};return true}
async function loadSharedState(){sync('Loading shared records…');const {data,error}=await dbr.from('wg_admin_state').select('json').eq('id',1).maybeSingle();if(error)throw error;if(data&&data.json){S=typeof data.json==='string'?JSON.parse(data.json):data.json;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}else{ // First device: preserve existing browser data, then seed the shared row.
 const {error:writeError}=await dbr.from('wg_admin_state').upsert({id:1,json:S,updated_at:new Date().toISOString()},{onConflict:'id'});if(writeError)throw writeError;
 }
 cloudReady=true;dbWait=false;sync('All devices synced');
 if(liveChannel)supa.removeChannel(liveChannel);
 liveChannel=supa.channel('wg-admin-shared-state').on('postgres_changes',{event:'*',schema:'public',table:'wg_admin_state',filter:'id=eq.1'},payload=>{if(!payload.new||!payload.new.json)return;remoteApplying=true;S=payload.new.json;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}remoteApplying=false;sync('Updated from another device');render()}).subscribe();
 render();
}
async function startCloud(){const configured=SUPABASE_URL.startsWith('https://')&&!SUPABASE_URL.includes('PASTE_')&&SUPABASE_ANON_KEY.length>20&&!SUPABASE_ANON_KEY.includes('PASTE_');if(!configured){dbWait=false;render();return}
 if(!window.supabase){dbWait=false;render();return}
 supa=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);dbr=supa;
 // Supabase advises keeping auth callbacks synchronous; queue database work after the callback returns.
 supa.auth.onAuthStateChange((_event,session)=>{Promise.resolve().then(async()=>{if(session){curU=session.user.email;dbWait=true;cloudReady=false;render();try{await loadSharedState()}catch(e){dbWait=false;cloudReady=false;sync('Database error');info('Cloud database error',esc(e.message)+' Check that the SQL setup and permissions are correct.');render()}}else{curU=null;cloudReady=false;dbWait=false;if(liveChannel){supa.removeChannel(liveChannel);liveChannel=null}render()}})});
 }
const PG=[['dashboard','Dashboard'],['finance','Finance'],['events','Events'],['calendar','Calendar'],['clients','Clients'],['employees','Employees'],['settings','Settings']];
$('#nav').insertAdjacentHTML('beforeend',PG.map(p=>`<a href="#${p[0]}" data-p="${p[0]}" onclick="nav.classList.remove('open')">${p[1]}</a>`).join('')+'<a href="#" onclick="signOut();return false" style="margin-top:auto">Sign out</a><small id="sync" style="color:var(--mu);padding:6px 4px"></small><div class="samp" id="sb"></div>');
function render(){if(gate())return;const p=(location.hash.slice(1)in P)?location.hash.slice(1):'dashboard';document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.dataset.p==p));$('#ttl').textContent=PG.find(x=>x[0]==p)[1];$('#sb').textContent=S.sample?'Sample data — not real clients or payments':'';$('#sb').style.display=S.sample?'':'none';P[p]()}
addEventListener('hashchange',render);render();startCloud();
</script>
<!--
SUPABASE SQL SETUP — run once in Supabase Dashboard > SQL Editor:

create table if not exists public.wg_admin_state (
  id integer primary key check (id = 1),
  json jsonb not null,
  updated_at timestamptz not null default now()
);
alter table public.wg_admin_state enable row level security;
drop policy if exists "Authenticated users can read wedding admin state" on public.wg_admin_state;
drop policy if exists "Authenticated users can insert wedding admin state" on public.wg_admin_state;
drop policy if exists "Authenticated users can update wedding admin state" on public.wg_admin_state;
create policy "Authenticated users can read wedding admin state" on public.wg_admin_state for select to authenticated using (true);
create policy "Authenticated users can insert wedding admin state" on public.wg_admin_state for insert to authenticated with check (true);
create policy "Authenticated users can update wedding admin state" on public.wg_admin_state for update to authenticated using (true) with check (true);

Then open Database > Replication (or Publications) and enable realtime for wg_admin_state if it is not already enabled.
Create your shared login in Authentication > Users. Keep signups disabled if you only want the admin account created by you.
-->
</body></html>
